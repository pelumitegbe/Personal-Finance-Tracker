# .github/workflows/backend-ci.yml
name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./controllers ./tokens -v -count=1

      - name: Check code formatting
        run: |
          if [ -n "$(go fmt ./...)" ]; then
            echo "Code is not properly formatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...
